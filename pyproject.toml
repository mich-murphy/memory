[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sessions"
version = "0.3.0"
description = "Collect coding-agent session transcripts (Claude Code, Codex, Pi) from every machine into one R2 bucket"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# zstandard reads Codex rollouts, which Codex recompresses to .jsonl.zst after 7 days.
dependencies = ["boto3>=1.34", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-sessions = "agent_sessions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
