# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: agent-sessions
    main: ./cmd/agent-sessions
    binary: agent-sessions
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible: the same commit builds the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./install.sh

# Release immutability locks a release's assets and tag when it's published, so every asset
# goes up to a draft first; publish it with `gh release edit <tag> --draft=false` once checked.
release:
  draft: true
  replace_existing_draft: true
  extra_files:
    - glob: ./install.sh

sboms:
  - artifacts: binary

changelog:
  use: github
  sort: asc
