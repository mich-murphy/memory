version: 2
updates:
  - package-ecosystem: gomod
    # The collector, the pinned dev tools, and gopls (its own module: it needs a different
    # golang.org/x/tools from deadcode's).
    directories: ["/", "/tools", "/tools/gopls"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
