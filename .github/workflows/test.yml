name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q
