name: Rust rewrite gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: false
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      # The flake's cargo-llvm-cov override is never in cache.nixos.org and took
      # about 9 minutes to build on macos-26. Cache it as a local Nix binary
      # cache; the exact key covers both pin files, so a tool built from
      # different pins is never restored.
      - name: Restore the built cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nix-llvm-cov-cache
          key: nix-llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - name: Import the cached cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit == 'true'
        run: >-
          nix copy --no-check-sigs --from "file://$HOME/nix-llvm-cov-cache"
          "$(nix eval --raw .#cargo-llvm-cov.outPath)"
      - name: Build and export cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: |
          nix build .#cargo-llvm-cov --no-link --max-jobs 2 --cores 2
          nix copy --to "file://$HOME/nix-llvm-cov-cache" "$(nix eval --raw .#cargo-llvm-cov.outPath)"
      - name: Run all Rust gates without live access
        run: >-
          nix develop .#rust --max-jobs 2 --cores 2 --command
          sh -c 'cd rust && PROPERTY_CASES=500 bash scripts/gates.sh'
      - name: Preserve gate statuses, seeds and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-gates-${{ matrix.os }}
          path: |
            rust/artifacts/*.log
            rust/artifacts/*.tsv
            rust/artifacts/*.txt
            rust/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
