name: Rust rewrite gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: false
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Run all Rust gates without live access
        run: >-
          nix develop --max-jobs 2 --cores 2 --command
          sh -c 'cd rust && PROPERTY_CASES=500 bash scripts/gates.sh'
      - name: Preserve gate statuses, seeds and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-gates-${{ matrix.os }}
          path: |
            rust/artifacts/*.log
            rust/artifacts/*.tsv
            rust/artifacts/*.txt
            rust/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
