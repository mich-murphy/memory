# Git hooks: `make hooks` installs them. CI runs the same checks, so these only save a round trip.
# lefthook lives in tools/go.mod, so the installed hooks call it through `go tool`; a hook that
# can't find it fails instead of letting the commit through unchecked.
lefthook: go tool -modfile=tools/go.mod lefthook
assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: format
      run: golangci-lint fmt {staged_files}
      glob: "**/*.go"
      stage_fixed: true
    - name: lint
      run: make lint
      glob: ["**/*.go", ".golangci.yml", ".golangci-lint-version"]
    - name: tidy
      run: make tidy-check
      glob: ["**/*.go", "**/go.mod", "**/go.sum"]
    - name: actionlint
      run: go tool -modfile=tools/go.mod actionlint
      glob: ".github/workflows/*.y*ml"

pre-push:
  jobs:
    - name: test
      run: make test
