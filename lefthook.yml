lefthook: go tool -modfile=tools/go.mod lefthook
assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: format
      run: golangci-lint fmt {staged_files}
      glob: "**/*.go"
      stage_fixed: true
    - name: lint
      run: make lint
      glob: ["**/*.go", ".golangci.yml", ".golangci-lint-version"]
    - name: tidy
      run: make tidy-check
      glob: ["**/*.go", "**/go.mod", "**/go.sum"]
    - name: actionlint
      run: go tool -modfile=tools/go.mod actionlint
      glob: ".github/workflows/*.y*ml"

pre-push:
  jobs:
    - name: test
      run: make test
