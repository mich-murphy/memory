[profile.default]
test-threads = 2
failure-output = "immediate-final"
# A hung test fails with its name instead of running into the 30-minute CI job limit (brief 31,
# TIMEOUT). Measured on 2026-11-17: the slowest test that is not a property takes 8.9 s.
slow-timeout = { period = "60s", terminate-after = 3 }

# Properties at 500 cases: the slowest took 105 s (hegel_property4_capture_state_machine), the
# next two about 54 s. 15 minutes leaves room for coverage instrumentation and the slower ARM
# runner and still ends before the job limit.
[[profile.default.overrides]]
filter = 'test(/hegel_/) | test(/proptest_/)'
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.ci]
test-threads = 2
fail-fast = false
