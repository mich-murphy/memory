[workspace]
resolver = "3"
members = ["crates/memory-core", "crates/memory-reader", "crates/memory", "crates/xtask"]
exclude = ["lint-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
memory-core = { version = "=0.1.0", path = "crates/memory-core" }
memory-reader = { version = "=0.1.0", path = "crates/memory-reader" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1"
thiserror = "2"
toml = "1"
sha2 = "=0.11.1"
regex = "1"
url = "2"
hegel = { package = "hegeltest", version = "=0.52.0", features = ["static-engine"] }
proptest = "1"
proptest-state-machine = "0.8"
# Source read before pinning: crates.io notify-8.2.0/Cargo.toml.
notify = "=8.2.0"
# Already in the lockfile via notify; same version, so no new crate enters it. `fs` only.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
# S3 client chosen by prototype P2 (docs/rust-rewrite/prototypes/P2-s3-client.md): blocking, and
# neither crate retries, so a `current.json` write is never resent behind the caller.
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# Content-MD5 on uploads (DESIGN.md 7.3 step 6; R2 enforces it, P2b).
md-5 = { version = "=0.11.0", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# Piece encoding, level 3 (DESIGN.md 7.3 step 4, amendment A13.2). No legacy formats or dictionaries.
zstd = { version = "=0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes = "deny"
missing_errors_doc = "warn"
