[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "CC0-1.0", "Zlib"]
# The Mozilla root certificate list that ureq's rustls verifies R2 against is data under a
# permissive data licence. Allowed for that crate only (P2 decision, report 25).
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
