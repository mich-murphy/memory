# memory-core is the pure core (DESIGN.md section 3): no I/O, no clock, no randomness. The
# shell (`memory`) injects all of them through traits. Clippy reads this file only for this
# crate, so the shell is unaffected. A violation here is a design violation, not a style nit.
disallowed-types = [
    { path = "std::fs::File", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::OpenOptions", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::net::TcpStream", reason = "pure core: network I/O belongs to the shell" },
    { path = "std::net::TcpListener", reason = "pure core: network I/O belongs to the shell" },
    { path = "std::net::UdpSocket", reason = "pure core: network I/O belongs to the shell" },
    { path = "std::process::Command", reason = "pure core: no subprocesses" },
    { path = "std::time::Instant", reason = "pure core: time arrives as an injected Duration" },
    { path = "std::time::SystemTime", reason = "pure core: time arrives as an injected Duration" },
    { path = "std::hash::RandomState", reason = "pure core: no per-process randomness; use BTreeMap or a fixed hasher" },
]
disallowed-methods = [
    { path = "std::fs::read", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::read_to_string", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::write", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::read_dir", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::metadata", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::remove_file", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::fs::create_dir_all", reason = "pure core: file I/O belongs to the shell" },
    { path = "std::env::var", reason = "pure core: the environment is shell input" },
    { path = "std::env::var_os", reason = "pure core: the environment is shell input" },
    { path = "std::env::vars", reason = "pure core: the environment is shell input" },
    { path = "std::env::vars_os", reason = "pure core: the environment is shell input" },
    { path = "std::env::args", reason = "pure core: arguments are shell input" },
    { path = "std::env::args_os", reason = "pure core: arguments are shell input" },
    { path = "std::env::current_dir", reason = "pure core: the working directory is shell state" },
    { path = "std::thread::sleep", reason = "pure core: waiting is the shell's clock" },
    { path = "std::thread::spawn", reason = "pure core: no threads" },
    { path = "std::process::exit", reason = "pure core: only the shell decides to exit" },
    { path = "std::io::stdin", reason = "pure core: no ambient I/O" },
]
