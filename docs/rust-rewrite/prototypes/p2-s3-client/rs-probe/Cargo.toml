[package]
name = "p2-rs-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
sha2 = "=0.10.9"
md-5 = "=0.10.6"
base64 = "=0.22.1"
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
