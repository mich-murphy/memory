[package]
name = "p2-os-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "time"] }
futures = "=0.3.31"
bytes = "=1.10.1"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
base64 = "=0.22.1"
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
